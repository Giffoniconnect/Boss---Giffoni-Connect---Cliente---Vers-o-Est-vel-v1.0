<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOSS Giffoni Clientes</title>
    <meta name="description" content="Núcleo administrativo e Portal do Cliente espelhado e modular para Giffoni Connect." />
    <meta property="og:title" content="BOSS Giffoni Clientes" />
    <meta property="og:description" content="Núcleo administrativo e Portal do Cliente espelhado e modular para Giffoni Connect." />
    <style>
      #boss-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f8fafc;
        color: #1e293b;
      }
      .boss-splash-logo {
        width: 64px;
        height: 64px;
        background: #2563eb;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-size: 30px;
        font-weight: 800;
        box-shadow: 0 12px 24px -6px rgba(37, 99, 235, 0.35);
        margin-bottom: 20px;
      }
      .boss-splash-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #cbd5e1;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: boss-spin 0.8s linear infinite;
      }
      @keyframes boss-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boss-splash">
        <div class="boss-splash-logo">G</div>
        <h1 style="font-size: 22px; font-weight: 700; color: #0f172a; margin: 0 0 6px 0;">Giffoni Connect</h1>
        <p style="font-size: 14px; color: #64748b; margin: 0 0 20px 0;">Núcleo Inteligente BOSS</p>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #475569;">
          <div class="boss-splash-spinner"></div>
          <span>Iniciando ambiente...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
